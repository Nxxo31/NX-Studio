# NO incluido en config.yaml activo (protegido por Hermes).
# Para activar: pegar cada bloque bajo mcp_servers: en config.yaml
# y setear las env vars correspondientes en C:\Users\sebas\AppData\Local\hermes\.env
#
# Ver docs/agencia/MCP-ACTIVATION.md para instrucciones paso a paso.
