# ╔══════════════════════════════════════════════════════════════════════╗
# ║ MCPs DE INVESTIGACIÓN Y MENSAJERÍA                                   ║
# ╚══════════════════════════════════════════════════════════════════════╝

# ── Exa (research semántica) ───────────────────────────────────────────
# ✅ LISTO: EXA_API_KEY ya existe en .env
# Comando: hosted remote (no instala nada local)
exa:
  command: npx
  args:
    - -y
    - mcp-remote
    - https://mcp.exa.ai/mcp
  env:
    EXA_API_KEY: ${EXA_API_KEY}
  enabled: true

# ── Wompi — Fortaleza Colombia ─────────────────────────────────────────
# ❌ PENDIENTE: signup en comercios.wompi.co
# Métodos: PSE, Nequi, Botón Bancolombia, tarjeta débito/crédito
# Segmentos: Empresas B2B colombianas, alto valor COP, gobierno
# Docs: https://docs.wompi.co/
wompi:
  command: npx
  args:
    - -y
    - '@codespar/mcp-wompi'
  env:
    WOMPI_PUBLIC_KEY: ${WOMPI_PUBLIC_KEY}
    WOMPI_PRIVATE_KEY: ${WOMPI_PRIVATE_KEY}
    WOMPI_EVENTS_KEY: ${WOMPI_EVENTS_KEY}
  enabled: false  # cambiar a true después de poblar .env

# ── MercadoPago — Cobertura LATAM universal ────────────────────────────
# ✅ LISTO: signup gratuito, sandbox inmediato
# Métodos: Nequi, Daviplata, PSE, Efecty, Baloto, tarjeta, Pix, SPEI, OXXO, Yape
# Segmentos: TODOS los colombianos bancarizados + no bancarizados
# Docs: https://www.mercadopago.com.co/developers/en/docs/ai-resources
mercadopago:
  command: npx
  args:
  - -y
  - '@codespar/mcp-mercado-pago'
  env:
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN}
  enabled: false
# Alternativa hosted oficial: https://mcp.mercadopago.com/mcp

# ── Stripe — Internacional + suscripciones USD ──────────────────────────
# ✅ LISTO: signup en dashboard.stripe.com
# Métodos: Tarjeta global, ACH, SEPA, Klarna, Apple/Google Pay, USDC
# Segmentos: USA/EU/UK, suscripciones, freelancers recibiendo USD
# Docs: https://docs.stripe.com/mcp
stripe:
  command: npx
  args:
  - -y
  - mcp-remote
  - https://mcp.stripe.com
  env:
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
  enabled: false

# ── Asaas — Brasil profundo (Pix + Boleto) ─────────────────────────────
# ❌ PENDIENTE: requiere CNPJ o CPF
# Métodos: Pix (44% e-commerce BR), Boleto, cartão parcelado, recorrente
# Segmentos: Empresas BR, freelancers BR, e-commerce BR
# Docs: https://docs.asaas.com/
asaas:
  command: npx
  args:
  - -y
  - '@codespar/mcp-asaas'
  env:
      ASAAS_API_KEY: ${ASAAS_API_KEY}
  enabled: false

# ── Coinbase Commerce — USDC/crypto sin fricción ───────────────────────
# ❌ PENDIENTE: API key + wallet
# Métodos: USDC (Base, Ethereum, Polygon), BTC, ETH
# Segmentos: Clientes crypto-friendly, freelancers recibiendo stablecoins
# Docs: https://commerce.coinbase.com/docs/
coinbase-commerce:
  command: npx
  args:
  - -y
  - '@coinbase/commerce-mcp'
  env:
      COINBASE_COMMERCE_API_KEY: ${COINBASE_COMMERCE_API_KEY}
  enabled: false

# ── Payoneer — Freelancers recibiendo USD/EUR global ──────────────────
# ❌ PENDIENTE: verificación identidad + bancaria
# Métodos: Recibir USD/EUR/GBP de clientes globales, payouts a banco local
# Segmentos: Freelancers CO→US/EU, agencies exportadoras de servicios
# Docs: https://developer.payoneer.com/
payoneer:
  command: npx
  args:
  - -y
  - '@codespar/mcp-payoneer'
  env:
      PAYONEER_CLIENT_ID: ${PAYONEER_CLIENT_ID}
      PAYONEER_CLIENT_SECRET: ${PAYONEER_CLIENT_SECRET}
  enabled: false

# ── Wise — FX mid-market (mejor rate para transferencias) ──────────────
# ❌ PENDIENTE: signup + verificación
# Métodos: Transferencias multi-moneda con rate real, multi-currency account
# Segmentos: Freelancers recibiendo >$1k/mes, agencies con costos EUR
# Docs: https://docs.wise.com/
wise:
  command: npx
  args:
  - -y
  - mcp-remote
  - https://mcp.wise.com/v1/mcp
  env:
      WISE_API_TOKEN: ${WISE_API_TOKEN}
  enabled: false

# ╔══════════════════════════════════════════════════════════════════════╗
# ║ TIER 3 — ENTERPRISE (solo con clientes corporativos grandes)         ║
# ╚══════════════════════════════════════════════════════════════════════╝
