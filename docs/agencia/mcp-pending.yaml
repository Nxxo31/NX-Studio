# ── 3. WhatsApp Business Cloud API ──────────────────────────────────────
# ❌ PENDIENTE: requiere cuenta Meta Business + WABA + phone number
# Wizard oficial: hermes whatsapp-cloud (interactivo)
# Pasos:
#   1. Crear app en https://developers.facebook.com/apps/
#   2. Agregar producto "WhatsApp" → API Setup
#   3. Obtener: WHATSAPP_TOKEN (system user permanent), WHATSAPP_PHONE_ID,
#      WHATSAPP_BUSINESS_ID (WABA ID)
#   4. Webhook público obligatorio para recibir mensajes (usar
#      cloudflared tunnel o deploy en Cloudflare Workers)
#   5. Correr: hermes whatsapp-cloud → sigue el wizard
#   6. El wizard modifica config.yaml automáticamente
whatsapp-cloud:
  command: npx
  args:
    - -y
    - wbmcp@latest
  env:
    WHATSAPP_TOKEN: ${WHATSAPP_TOKEN}
    WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID}
    WHATSAPP_BUSINESS_ID: ${WHATSAPP_BUSINESS_ID}
  enabled: false

# ── 4. Apify (scraping + 8000+ actors) ─────────────────────────────────
# ❌ PENDIENTE: requiere APIFY_TOKEN
#   1. Crear cuenta en https://apify.com (free tier $5/mes)
#   2. Settings → Integrations → copiar APIFY_TOKEN (empieza con apify_api_)
#   3. Agregar APIFY_TOKEN=apify_api_xxx al .env
#   4. Alternativa hosted con OAuth: https://mcp.apify.com (más features)
apify:
  command: npx
  args:
    - -y
    - '@apify/actors-mcp-server'
    - '--tools'
    - 'actors,docs,apify/rag-web-browser,apify/web-fetch'
  env:
    APIFY_TOKEN: ${APIFY_TOKEN}
  enabled: false

# ── 5. Sentry (QA + monitoring producción) ──────────────────────────────
# ❌ PENDIENTE: requiere OAuth con cuenta Sentry en primer uso
# Sentry usa hosted MCP con OAuth — no requiere npm local
# Pasos:
#   1. Crear org/proyecto en https://sentry.io
#   2. Pegar bloque abajo en config.yaml con enabled: true
#   3. Primer tool call dispara flujo OAuth → autorizar en browser
sentry:
  command: npx
  args:
    - -y
    - mcp-remote
    - https://mcp.sentry.dev/mcp
  enabled: false

# ── 6. Cloudflare (deploy Workers) ──────────────────────────────────────
# ⚠️ NO es un MCP npm — es plataforma para deployar tu PROPIO MCP server
# Cuando lo necesites:
#   1. npm create cloudflare@latest -- my-mcp --template=cloudflare/ai/demos/remote-mcp-authless
#   2. Editar src/index.ts y agregar tools custom
#   3. npm run deploy → URL: my-mcp.<cuenta>.workers.dev/sse
#   4. Pegar abajo con la URL resultante:
# cloudflare:
#   command: npx
#   args:
#     - -y
#     - mcp-remote
#     - https://my-mcp.<cuenta>.workers.dev/sse
#   enabled: false