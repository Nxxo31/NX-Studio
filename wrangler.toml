name = "nx-studio"
compatibility_date = "2026-10-01"
# nodejs_compat activa un falso-positivo de isNode en workerd (astro#14511):
# las rutas SSR devuelven "[object Object]". disable_nodejs_process_v2 evita
# que el process nativo v2 quede expuesto antes del polyfill de unenv.
# NOTA: este combo rompe `wrangler pages dev` local en wrangler 4.143.0
# ("No such module @cloudflare/unenv-preset/node/process" desde pages-shim.js).
# La corrección upstream está en wrangler 4.151.0+. Para testear el backend
# local antes de eso, usar staging o el live (workers.dev). NO cambiar sin
# verificar SSR en prod (riesgo de astro#14511).
compatibility_flags = ["nodejs_compat", "disable_nodejs_process_v2"]
workers_dev = true

# El worker corre ANTES que los assets SOLO en rutas de página/API: el
# middleware i18n necesita ver cada request de página (cf-ipcountry → 302
# al locale) aunque la página final sea un archivo pre-renderizado servido
# vía el binding ASSETS.
#
# FORMA ARRAY, NO BOOLEANA (fix 2026-10-22 del "Bug conocido: astro dev no
# hidrata" de AGENTS.md): con `run_worker_first = true`, el plugin de
# Cloudflare enruta TODAS las requests del dev server al worker en
# miniflare ANTES del middleware de Vite — /@vite/client, /@id/astro:scripts/*
# y todo el grafo de módulos devolvían 404 y 0/4 islas hidrataban
# (cloudflare/workers-sdk#14626). Con la forma array, las URLs internas de
# Vite y los assets estáticos (/_astro/*, imágenes) caen directo a Vite /
# al binding ASSETS (sin cold start del worker por asset); las rutas
# desconocidas sin asset siguen llegando al worker (fallback 404 intacto).
[assets]
run_worker_first = [
  "/",
  "/en", "/en/*",
  "/pt", "/pt/*",
  "/productos", "/productos/*",
  "/templates", "/templates/*",
  "/servicios", "/servicios/*",
  "/laboratorio", "/laboratorio/*",
  "/cotizador", "/cotizador/*",
  "/contacto", "/contacto/*",
  "/docs", "/docs/*",
  "/brand", "/brand/*",
  "/logos", "/logos/*",
  "/style-lab", "/style-lab/*",
  "/api/*",
  "/portal", "/portal/*",
  "/admin", "/admin/*",
]
# Para Pages, no se necesita `main` — el runtime lo detecta desde dist/_worker.js
# automáticamente. Sí necesitamos la lista de páginas (público) desde `dist/`.

[vars]
BETTER_AUTH_URL = "https://nx-studio.nx-studio.workers.dev"

[[kv_namespaces]]
binding = "SESSION"
id = "f091bf1a355141128fad68a23cab69b3"

[[d1_databases]]
binding = "DB"
database_name = "nx-studio-db"
database_id = "9e19c8e0-57fb-4ab0-b572-80889c292987"
migrations_dir = "drizzle/migrations"

[observability]
enabled = true

# .dev.vars (gitignored) se usa para secretos locales:
#   BETTER_AUTH_SECRET=...
#   RESEND_API_KEY=...
#   CONTACT_EMAIL=...
#   GOOGLE_CLIENT_ID=...
#   GOOGLE_CLIENT_SECRET=...
# En producción: wrangler pages secret put <NAME> --project-name nx-studio

